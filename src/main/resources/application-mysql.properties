# ---------------------------------------------------------------
# OPTIONAL: MySQL configuration.
# This file is ignored unless you activate the "mysql" profile:
#
#     mvn spring-boot:run -Dspring-boot.run.profiles=mysql
#
# Step 1 - create the database once (in the MySQL shell):
#     CREATE DATABASE expense_splitter;
#
# Step 2 - change the username/password below (or override them with
#          environment variables DB_USERNAME and DB_PASSWORD).
#
# Step 3 - run the command above. Tables are created automatically.
# ---------------------------------------------------------------

spring.datasource.url=jdbc:mysql://localhost:3306/expense_splitter?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:change-me}

# Hibernate picks the right MySQL dialect automatically.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# The H2 console is not needed with MySQL.
spring.h2.console.enabled=false
