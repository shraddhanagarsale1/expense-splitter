# ---------------------------------------------------------------
# Default configuration: runs out of the box with an in-memory H2 database.
# Data is lost when the app stops (great for demos and tests).
# To use MySQL instead, see application-mysql.properties.
# ---------------------------------------------------------------
spring.application.name=expense-splitter
server.port=8080

# --- Database (H2 in memory) ---
spring.datasource.url=jdbc:h2:mem:expensedb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
# "update" creates the tables automatically from the @Entity classes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- H2 web console: http://localhost:8080/h2-console ---
# JDBC URL to type in the login page: jdbc:h2:mem:expensedb  (user: sa, empty password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
